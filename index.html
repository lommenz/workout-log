<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#dfe3e8;--blue:#2563eb;--green:#15803d;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 10px calc(44px + env(safe-area-inset-bottom))}
header{padding:16px 2px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}header>div:last-child button{font-size:90%;padding:9px 11px}h1{font-size:25px;margin:0}.date{font-size:12px;color:var(--muted);margin-top:3px}.header-date{display:block;width:auto;border:0;border-radius:0;padding:0;background:transparent;color:var(--muted);line-height:1.2;min-height:0;font:inherit;font-size:12px;margin-top:3px;margin-left:2px;appearance:none;-webkit-appearance:none}.header-date::-webkit-date-and-time-value{text-align:left}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}.header-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:750;color:var(--muted);margin-bottom:5px}
input,textarea{width:100%;min-width:0;font:inherit;border:1px solid #cfd5dc;border-radius:10px;padding:10px;background:#fff;color:var(--text)}textarea{height:42px;min-height:42px;resize:vertical}
.dragging-movement{opacity:.55}.drag-over-movement{outline:2px dashed #9aa4b2;outline-offset:3px}.movement-drag{touch-action:pan-y;cursor:grab;-webkit-user-select:auto;user-select:auto}
.edit-reps-input{height:44px;line-height:22px;font-size:16px;-webkit-appearance:none;appearance:none;vertical-align:middle;display:block}.reps-plus-wrap{position:relative;display:block;min-width:0}.reps-plus-wrap input{width:100%;min-width:0;padding-right:30px!important}.rep-plus-btn{position:absolute!important;right:4px!important;top:50%!important;transform:translateY(-50%)!important;width:24px!important;min-width:24px!important;height:28px!important;padding:0!important;border:0!important;background:transparent!important;color:#6b7280!important;border-radius:6px!important;font-size:19px!important;font-weight:600!important;line-height:1!important;display:flex!important;align-items:center!important;justify-content:center!important;box-shadow:none!important}
hr{border:0;border-top:2px solid #111;margin:16px 0}.quick{display:grid;grid-template-columns:minmax(0,1fr) 74px minmax(0,1fr) 70px 58px;gap:6px;align-items:end}.quick input{padding:10px 8px}.quick button{width:100%;padding:10px 4px}
.line{padding:13px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}.line-main{display:flex;align-items:center;gap:6px}.line-name{font-weight:750;flex:1;min-width:0}.movement-tag{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:#e7e9ed;color:#374151;border-radius:6px;padding:3px 5px;vertical-align:middle;margin-left:4px}.line-text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;margin-top:5px}.mini{font-size:11px;color:var(--muted);margin-top:4px}
button{font:inherit;font-weight:700;border:0;border-radius:11px;padding:10px 12px;background:var(--blue);color:#fff;white-space:nowrap}.secondary{background:#e7e9ed;color:#111827}.ghost{background:transparent;color:var(--blue);padding:5px}.danger{background:transparent;color:var(--red);padding:5px}
.actions{display:flex;gap:8px;margin:11px 0}.actions button{flex:1}.hint{font-size:11px;color:var(--muted);margin-top:7px}.memory-hint{font-size:10px;color:var(--muted);margin-top:4px}.empty{text-align:center;color:var(--muted);padding:34px 10px}
.history-wrap{position:relative;overflow:hidden;border-radius:15px;margin:9px 0}.history-delete{position:absolute;inset:0 0 0 auto;width:132px;border-radius:0;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:12px}.history-item{cursor:pointer;margin:0;position:relative;z-index:1;transition:transform .2s ease}.history-item.swiped{transform:translateX(-132px)}.history-head{display:flex;align-items:flex-start;gap:8px}.history-head-text{flex:1;min-width:0}.trash-btn{background:transparent;color:var(--red);padding:3px 6px;font-size:18px;line-height:1}.history-title{font-weight:750}.meta{font-size:12px;color:var(--muted);margin-top:4px}.summary{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;margin-top:8px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:3px;padding:2px 8px calc(0px + env(safe-area-inset-bottom));z-index:5}.bottom button{background:transparent;color:var(--muted);font-size:12px;padding:4px 13px 2px}.bottom button.active{color:var(--blue)}
.rest-timer-card{margin-bottom:4px}.timer-zero{animation:timerBlink .55s steps(1,end) infinite}@keyframes timerBlink{50%{opacity:.18}}.rest-timer-row{margin-top:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.rest-timer-row select{width:100%;font:inherit;border:1px solid #cfd5dc;border-radius:10px;padding:10px;background:#fff;color:var(--text)}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:#fff;border-radius:18px 18px 0 0;width:min(720px,100%);padding:17px 14px calc(20px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
@media(max-width:520px){.header-grid{grid-template-columns:1fr}.quick{grid-template-columns:82px minmax(0,1fr) 78px 54px}.quick .qname{grid-column:1/5}.quick .qweight{grid-column:1/2}.quick .qreps{grid-column:2/3}.quick .qrest-wrap{grid-column:3/4}.quick button{grid-column:4/5;grid-row:2}}
.movement-group{border:1px solid #d8dde3;border-radius:12px;margin:8px 0;overflow:hidden;background:var(--bg)}
.movement-group summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:750;display:flex;justify-content:space-between;align-items:center;background:var(--bg)}
.movement-group summary::-webkit-details-marker{display:none}
.movement-group .movement-body{padding:0 14px 12px;background:var(--bg)}
.movement-set{padding:8px 0;border-top:1px solid #edf0f2}
.movement-count{font-size:12px;font-weight:500;opacity:.65;margin-left:8px}
.compact-header{row-gap:6px}
.compact-header input,.compact-header textarea{padding:10px}.superset-toggle{width:28px;height:28px;min-width:28px;border-radius:50%;padding:0!important;display:inline-flex;align-items:center;justify-content:center;font-size:12px!important;font-weight:850!important;background:#e8f0ff!important;color:var(--blue)!important;border:1px solid #b8ccff!important}.superset-toggle.on{background:#e8f7ed!important;color:var(--green)!important;border-color:#a8d8b7!important}.qrest-wrap{min-width:0;position:relative}.qrest-wrap .qrest{width:100%}.field-subtext{position:absolute;left:0;right:0;top:100%;font-size:9px;line-height:11px;color:var(--muted);text-align:center;margin-top:1px;pointer-events:none}.line-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.tag-mini{font-size:9px!important;padding:4px 6px!important;border-radius:7px!important;line-height:1.1!important}.drop-row{display:grid;grid-template-columns:82px minmax(0,1fr);gap:6px;margin:8px 0 0 14px;padding:8px 0 0 10px;border-left:3px solid #dfe3e8}.drop-row input{padding:9px 8px}.drop-label{grid-column:1/3;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--muted)}.superset-label{text-align:center;font-size:10px;font-weight:800;color:var(--muted);margin:10px 0 6px}.superset-save{background:transparent!important;color:var(--blue)!important;font-size:9px!important;padding:2px 5px!important;margin-left:5px!important;vertical-align:baseline}.superset-save.saved{color:var(--green)!important}.superset-row{display:grid;grid-template-columns:minmax(90px,1.4fr) 78px minmax(90px,1fr) 78px;gap:6px;align-items:start}.superset-row input{min-width:0;padding:9px 8px}.superset-row .qrest-wrap{min-width:0}.child-saved{padding-left:0}.child-saved .line-actions{margin-left:auto}.child-text{padding-left:0}.drop-label{text-align:center;margin-top:10px}@media(max-width:520px){.superset-row{grid-template-columns:1fr 74px}.superset-row input:first-child{grid-column:1/3}.superset-row .super-reps{grid-column:1/2}.superset-row .qrest-wrap{grid-column:2/3}}
</style></head><body>
<div class="app"><header><div><h1>Workout Log</h1><input id="headerDate" class="header-date" type="date" aria-label="Workout date"></div><div style="display:flex;gap:8px;align-items:center"><button onclick="saveWorkout()">Save</button><button onclick="newWorkout()">+ Workout</button></div></header><main id="app"></main></div>
<nav class="bottom"><button data-tab="log">Workout</button><button data-tab="history">History</button><button data-tab="backup">Backup</button></nav>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY="workout_log_v4";const ACTIVE_KEY="workout_log_active_session";const TIMER_KEY="workout_log_last_rest";let db=JSON.parse(localStorage.getItem(KEY)||"null")||JSON.parse(localStorage.getItem("workout_log_v3")||"null")||{history:[],draft:null};if(!db.history)db.history=[];let tab="log",current=JSON.parse(localStorage.getItem(ACTIVE_KEY)||"null")||db.draft||blank(),timerInt,timerEnd,timerActive=false,timerPreset=null,timerDone=false;let autosaveTimer=null;let repDashTimer=null;
function blank(){return{id:Date.now(),date:new Date().toISOString().slice(0,10),focus:"",note:"",location:"",exercises:[]}}
function migrateLegacySupersets(){let changed=false;const workouts=[...db.history,current];workouts.forEach(w=>w?.exercises?.forEach(e=>{if(e.tag==="Superset"||e.superSet){e.superset=true;if(e.tag==="Superset")e.tag="";delete e.superSet;changed=true}}));if(changed){db.draft=current;localStorage.setItem(KEY,JSON.stringify(db))}}
migrateLegacySupersets();
function save(){db.draft=JSON.parse(JSON.stringify(current));localStorage.setItem(ACTIVE_KEY,JSON.stringify(current));localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}
function reps(s){return String(s).replace(/,/g,"-").split("-").map(x=>x.trim()).filter(Boolean)}
function validRepToken(x){return /^(?:(?:[0-9⁰¹²³⁴⁵⁶⁷⁸⁹]+(?:\.[0-9⁰¹²³⁴⁵⁶⁷⁸⁹]+)?|\.[0-9⁰¹²³⁴⁵⁶⁷⁸⁹]+)\+?|To Fail(?:\s+[0-9⁰¹²³⁴⁵⁶⁷⁸⁹]+(?:\.[0-9⁰¹²³⁴⁵⁶⁷⁸⁹]+)?)?|Run the Rack)$/i.test(String(x))}
function knownValues(field){const vals=[];db.history.forEach(w=>{if(w[field]&&String(w[field]).trim()&&!vals.some(v=>v.toLowerCase()===String(w[field]).trim().toLowerCase()))vals.push(String(w[field]).trim())});if(current[field]&&String(current[field]).trim()&&!vals.some(v=>v.toLowerCase()===String(current[field]).trim().toLowerCase()))vals.unshift(String(current[field]).trim());return vals.slice(0,30)}
function knownFocuses(){return knownValues("focus")}
function knownLocations(){return knownValues("location")}
function rememberFields(){const f=document.getElementById("focus"),l=document.getElementById("location");if(f)current.focus=f.value;if(l)current.location=l.value;save()}
function populateMemories(query=""){
const u=a=>[...new Set(a.map(x=>String(x||"").trim()).filter(Boolean))].slice(0,30);
const f=u(db.history.map(w=>w.focus).concat(current.focus));
const l=u(db.history.map(w=>w.location).concat(current.location));
const allM=u(db.history.flatMap(w=>w.exercises.map(e=>e.name)).concat(current.exercises.map(e=>e.name)));
const q=String(query||"").trim().toLowerCase();const m=q?allM.filter(v=>v.toLowerCase().includes(q)).slice(0,30):allM;
[["focusMemory",f],["locationMemory",l],["movementMemory",m]].forEach(([id,a])=>{const e=document.getElementById(id);if(e)e.innerHTML=a.map(v=>`<option value="${esc(v)}"></option>`).join("")});
}

function normalizeMovementName(n){return String(n||"").trim().replace(/\s+/g," ").toLowerCase()}
function groupedExercises(exercises){
  const groups=[], byName=new Map();
  exercises.forEach((e,i)=>{
    const key=normalizeMovementName(e.name);
    if(!byName.has(key)){const g={name:e.name,items:[],first:i};byName.set(key,g);groups.push(g)}
    byName.get(key).items.push({...e,_index:i});
  });
  return groups;
}
function updateMovementSuggestions(v){populateMemories(v)}
function render(){if(tab==="log"&&current&&!current._dateTouched&&!current.exercises.length){current.date=new Date().toISOString().slice(0,10)}const hd=document.getElementById("headerDate");if(hd){hd.value=current.date;hd.style.display=tab==="log"?"block":"none";}document.addEventListener("input",e=>{if(tab!=="log")return;const t=e.target;if(t.id==="focus"||t.id==="location"||t.id==="note"||t.id==="qname"||t.id==="qweight"||t.id==="qreps"||t.id==="qrest")sync()},{passive:true});
document.querySelectorAll(".bottom button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));document.getElementById("app").innerHTML=tab==="history"?historyView():tab==="backup"?backupView():logView();populateMemories();renderTimerState()}
function logView(){return `<div class="card"><div class="compact-header"><div><label>Focus</label><input id="focus" onchange="rememberFields()" list="focus-options" autocomplete="on" placeholder="Chest / Tri" value="${esc(current.focus)}" oninput="rememberFields()"><datalist id="focus-options">${knownFocuses().map(v=>`<option value="${esc(v)}"></option>`).join("")}</datalist></div><div style="margin-top:6px"><label>Location</label><input id="location" onchange="rememberFields()" list="location-options" autocomplete="on" placeholder="Gym / Home" value="${esc(current.location)}" oninput="rememberFields()"><datalist id="location-options">${knownLocations().map(v=>`<option value="${esc(v)}"></option>`).join("")}</datalist></div><div style="margin-top:6px"><label>Notes</label><textarea id="note" placeholder="Optional">${esc(current.note)}</textarea></div></div></div><hr><div class="card"><b>Movement</b><div class="quick" style="margin-top:8px"><input id="qname" class="qname" list="movementMemory" placeholder="Name" value="${esc(current.quickDraft?.name||"")}" oninput="updateMovementSuggestions(this.value)"><datalist id="movementMemory"></datalist><input id="qweight" class="qweight" type="number" step="0.5" inputmode="decimal" placeholder="Weight" value="${esc(current.quickDraft?.weight||"")}"><div class="qreps reps-plus-wrap"><input id="qreps" placeholder="Reps" inputmode="decimal" autocomplete="off" value="${esc(current.quickDraft?.reps||"")}"><button type="button" class="rep-plus-btn" aria-label="Insert plus in reps" onclick="insertRepPlus('qreps',event)">+</button></div><div class="qrest-wrap"><input id="qrest" class="qrest" placeholder="Rest" inputmode="text" autocomplete="off" value="${esc(current.quickDraft?.rest||"")}"></div><button onclick="quickAdd()">Add</button></div></div><div>${current.exercises.length?groupedExercises(current.exercises).map(groupHTML).join(""):`<div class="empty">Add A Movement Above.<br><br><b>Ex: DB Flat Chest Press</b></div>`}</div><div class="card rest-timer-card"><div style="font-weight:750">Rest Timer</div><div class="rest-timer-row"><select id="restSelect" onchange="rememberRestTimer(this.value)"><option value="30">0:30</option><option value="60">1:00</option><option value="90">1:30</option><option value="120">2:00</option><option value="150">2:30</option><option value="180">3:00</option><option value="210">3:30</option><option value="240">4:00</option><option value="270">4:30</option><option value="300">5:00</option></select><button id="timerActionBtn" onclick="timerAction()">Start</button></div></div>`}
function groupHTML(g){if(g.items.length===1)return lineHTML(g.items[0],g.items[0]._index);return `<details class="movement-group" draggable="true" data-drag-index="${g.items[0]._index}"><summary><span>${esc(g.name)}<span class="movement-count">${g.items.length} entries</span></span><span>⌄</span></summary><div class="movement-body">${g.items.map(e=>lineHTML(e,e._index)).join("")}</div></details>`}
function lineHTML(e,i){let w=[...new Set(e.sets.map(s=>s.weight).filter(Boolean))].join("/"),r=e.sets.map(s=>s.reps).filter(Boolean).join(" - "),last=lastFor(e.name),tag=e.tag==="Dropset"?`<span class="movement-tag" data-tag-index="${i}" data-tag-name="Dropset">Dropset</span>`:"";
let drop="";if(e.tag==="Dropset"){const ds=e.dropSet||{};drop=ds.saved?`<div class="mini"><b>Dropset:</b> ${esc(ds.weight||"")} @ ${esc(ds.reps||"")} <button class="ghost" onclick="editDropSet(${i},event)">Edit</button></div>`:`<div class="superset-label">^Dropset^ <button class="superset-save" onclick="saveDropSet(${i},event)">SAVE</button></div><div class="drop-row"><input type="number" step="0.5" inputmode="decimal" placeholder="Weight" value="${esc(ds.weight||"")}" oninput="updateDropSet(${i},'weight',this.value)"><div class="reps-plus-wrap"><input id="drop-reps-${i}" class="drop-reps" inputmode="decimal" autocomplete="off" placeholder="Reps" value="${esc(ds.reps||"")}" oninput="updateDropSet(${i},'reps',this.value);handleSpecialReps(this,${i},'drop')"><button type="button" class="rep-plus-btn" aria-label="Insert plus in dropset reps" onclick="insertRepPlus('drop-reps-${i}',event)">+</button></div></div>`}
const superOn=!!e.superset;return `<div class="line movement-drag" draggable="true" data-drag-index="${i}"><div class="line-main"><div class="line-name">${esc(e.name)} ${tag}</div><div class="line-actions"><button class="tag-mini" onclick="setMovementTag(${i},'Dropset',event)">Dropset</button><button class="superset-toggle ${superOn?'on':''}" aria-pressed="${superOn?'true':'false'}" aria-label="${superOn?'Turn superset off':'Turn superset on'}" onclick="toggleSuperset(${i},event)">${superOn?'S ↓':'S'}</button><button class="ghost" onclick="editExercise(${i})">Edit</button><button class="danger" onclick="removeEx(${i})">×</button></div></div><div class="line-text">${esc(w)} @ ${esc(r)}${e.rest?` [${esc(e.rest)}]`:""}</div>${drop}${last?`<div class="mini">Last: <b>${esc(last)}</b></div>`:""}</div>`}

let dragFrom=null;
document.addEventListener("dragstart",e=>{const box=e.target.closest?.("[data-drag-index]");if(!box)return;dragFrom=Number(box.dataset.dragIndex);box.classList.add("dragging-movement");if(e.dataTransfer){e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragFrom))}});
document.addEventListener("dragover",e=>{const box=e.target.closest?.("[data-drag-index]");if(!box||dragFrom===null)return;e.preventDefault();document.querySelectorAll(".drag-over-movement").forEach(x=>x.classList.remove("drag-over-movement"));box.classList.add("drag-over-movement")});
document.addEventListener("drop",e=>{const box=e.target.closest?.("[data-drag-index]");if(!box||dragFrom===null)return;e.preventDefault();const to=Number(box.dataset.dragIndex);if(Number.isInteger(to)&&to!==dragFrom){const [m]=current.exercises.splice(dragFrom,1);current.exercises.splice(to,0,m);save();render()}dragFrom=null});
document.addEventListener("dragend",()=>{dragFrom=null;document.querySelectorAll(".dragging-movement,.drag-over-movement").forEach(x=>x.classList.remove("dragging-movement","drag-over-movement"))});
let tagPressTimer=null;document.addEventListener("pointerdown",e=>{const t=e.target.closest?.(".movement-tag");if(!t)return;const i=Number(t.dataset.tagIndex),tag=t.dataset.tagName;tagPressTimer=setTimeout(()=>{tagPressTimer=null;if(confirm(`Remove ${tag} From This Movement?`)){const ex=current.exercises[i];if(!ex)return;ex.tag="";if(tag==="Dropset")delete ex.dropSet;save();render()}},650)});["pointerup","pointercancel","pointermove"].forEach(type=>document.addEventListener(type,()=>{if(tagPressTimer){clearTimeout(tagPressTimer);tagPressTimer=null}}));
function updateDropSet(i,k,v){let e=current.exercises[i];if(!e)return;e.dropSet=e.dropSet||{weight:"",reps:"",saved:false};e.dropSet[k]=v;e.dropSet.saved=false;save()}
function saveDropSet(i,ev){ev?.preventDefault();ev?.stopPropagation();let e=current.exercises[i];if(!e?.dropSet)return;const ds=e.dropSet;if(!String(ds.weight||"").trim()&&!String(ds.reps||"").trim())return alert("Enter Dropset Details First.");ds.saved=true;save();render()}
function editDropSet(i,ev){ev?.preventDefault();ev?.stopPropagation();let e=current.exercises[i];if(!e?.dropSet)return;e.dropSet.saved=false;save();render();setTimeout(()=>document.querySelector(`.line[data-drag-index="${i}"] .drop-reps`)?.focus({preventScroll:true}),20)}
function toggleSuperset(i,ev){ev?.preventDefault();ev?.stopPropagation();sync();let e=current.exercises[i];if(!e)return;e.superset=!e.superset;delete e.superSet;if(e.tag==="Superset")e.tag="";save();render()}
function setMovementTag(i,tag,ev){ev?.stopPropagation();sync();let e=current.exercises[i];if(!e||tag!=="Dropset")return;e.tag=e.tag==="Dropset"?"":"Dropset";if(e.tag==="Dropset")e.dropSet=e.dropSet||{weight:"",reps:"",saved:false};save();render()}
function sync(){const hd=document.getElementById("headerDate"),f=document.getElementById("focus"),n=document.getElementById("note"),l=document.getElementById("location"),qn=document.getElementById("qname"),qw=document.getElementById("qweight"),qr=document.getElementById("qreps"),qt=document.getElementById("qrest");if(hd)current.date=hd.value||current.date;if(f)current.focus=f.value;if(n)current.note=n.value;if(l)current.location=l.value;if(qn||qw||qr||qt)current.quickDraft={name:qn?.value||"",weight:qw?.value||"",reps:qr?.value||"",rest:qt?.value||""};save()}
function autosave(){clearTimeout(autosaveTimer);sync()}
function flushAutosave(){try{sync()}catch(_){try{db.draft=current;localStorage.setItem(KEY,JSON.stringify(db))}catch(__){}}}
window.addEventListener("pagehide",flushAutosave);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushAutosave()});
function scheduleRepDash(input){clearTimeout(repDashTimer);if(!input||!/[0-9⁰¹²³⁴⁵⁶⁷⁸⁹+]$/.test(input.value))return;repDashTimer=setTimeout(()=>{if(document.activeElement!==input)return;if(/[0-9⁰¹²³⁴⁵⁶⁷⁸⁹+]$/.test(input.value)){input.value+="-";input.dispatchEvent(new Event("input",{bubbles:true}))}},2000)}
function insertRepPlus(id,ev){ev?.preventDefault();ev?.stopPropagation();const input=document.getElementById(id);if(!input)return;let start=typeof input.selectionStart==="number"?input.selectionStart:input.value.length,end=typeof input.selectionEnd==="number"?input.selectionEnd:start;input.value=input.value.slice(0,start)+"+"+input.value.slice(end);const pos=start+1;try{input.focus({preventScroll:true})}catch(_){input.focus()}try{input.setSelectionRange(pos,pos)}catch(_){}input.dispatchEvent(new Event("input",{bubbles:true}));scheduleRepDash(input)}
const specialRepTimers=new WeakMap();function handleSpecialReps(input,i,kind){if(!input)return;clearTimeout(repDashTimer);const prior=specialRepTimers.get(input);if(prior)clearTimeout(prior);let v=input.value;if(/^To Fail\d/.test(v)) {v=v.replace(/^To Fail(\d)/,"To Fail $1");input.value=v} if(v.endsWith("000")){input.value=v.slice(0,-3)+"Run the Rack";if(kind==="drop"&&Number.isInteger(i))updateDropSet(i,"reps",input.value);return;}if(v.endsWith("00")){const t=setTimeout(()=>{if(input.value.endsWith("00")){input.value=input.value.slice(0,-2)+"To Fail";if(kind==="drop"&&Number.isInteger(i))updateDropSet(i,"reps",input.value);input.dispatchEvent(new Event("change",{bubbles:true}))}},350);specialRepTimers.set(input,t);return;}if(kind==="drop"&&Number.isInteger(i))updateDropSet(i,"reps",input.value);scheduleRepDash(input)}
document.addEventListener("input",e=>{if(e.target?.id==="headerDate"){current.date=e.target.value||current.date;current._dateTouched=true;}if(e.target?.id==="qreps"||e.target?.id==="ep"){handleSpecialReps(e.target);}autosave()});document.addEventListener("change",e=>{if(e.target?.id==="headerDate"){current.date=e.target.value||current.date;current._dateTouched=true;}autosave()});
function quickAdd(){sync();let n=document.getElementById("qname").value.trim(),w=document.getElementById("qweight").value.trim(),r=document.getElementById("qreps").value.trim(),t=document.getElementById("qrest").value.trim();if(!n)return alert("Enter A Movement Name.");if(!w)return alert("Enter The Weight.");let rs=reps(r);if(!rs.length||rs.some(x=>!validRepToken(x)))return alert("Use Reps Like 13-12-9, 7.5-6.5, or 10+, with superscript digits allowed.");current.exercises.push({name:n,rest:t,sets:rs.map(x=>({weight:w,reps:x}))});current.quickDraft={name:"",weight:"",reps:"",rest:""};save();render();setTimeout(()=>document.getElementById("qname")?.focus(),20)}
function focusRepsAtEnd(){const reps=document.getElementById("ep");if(!reps)return;const place=()=>{const end=reps.value.length;try{reps.focus({preventScroll:true})}catch(_){reps.focus()}try{reps.setSelectionRange(end,end)}catch(_){}reps.scrollLeft=reps.scrollWidth};place();requestAnimationFrame(()=>{place();requestAnimationFrame(place)});setTimeout(place,80);setTimeout(place,220)}
function editExercise(i){let e=current.exercises[i];document.getElementById("sheet").innerHTML=`<h2>Edit movement</h2><label>Movement</label><input id="en" value="${esc(e.name)}"><div style="margin-top:10px"><label>Weight</label><input id="ew" type="number" step="0.5" inputmode="decimal" value="${esc(e.sets[0]?.weight||"")}"></div><div style="margin-top:10px"><label>Reps</label><div class="reps-plus-wrap"><input id="ep" class="edit-reps-input" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${esc(e.sets.map(s=>s.reps).join("-"))}"><button type="button" class="rep-plus-btn" aria-label="Insert plus in reps" onclick="insertRepPlus('ep',event)">+</button></div></div><div style="margin-top:10px"><label>Rest</label><input id="er" inputmode="text" autocomplete="off" value="${esc(e.rest||"")}"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button onclick="applyEdit(${i})">Save Changes</button></div>`;document.getElementById("modal").style.display="flex";const reps=document.getElementById("ep");if(reps&&/[0-9⁰¹²³⁴⁵⁶⁷⁸⁹]$/.test(reps.value))reps.value+="-";focusRepsAtEnd()}
function applyEdit(i){let n=document.getElementById("en").value.trim(),w=document.getElementById("ew").value.trim(),rs=reps(document.getElementById("ep").value),t=document.getElementById("er").value.trim();if(!n||!w||!rs.length||rs.some(x=>!validRepToken(x)))return alert("Check The Movement, Weight, And Reps.");current.exercises[i]={name:n,rest:t,tag:current.exercises[i].tag||"",dropSet:current.exercises[i].dropSet,superset:!!current.exercises[i].superset,sets:rs.map(x=>({weight:w,reps:x}))};save();closeModal();render()}
function closeModal(){document.getElementById("modal").style.display="none"}function removeEx(i){if(confirm("Remove This Movement?")){current.exercises.splice(i,1);save();render()}}
function newWorkout(){if(current.exercises.length&&!confirm("Start A New Workout? Your Current Draft Will Be Replaced."))return;current=blank();save();render()}
function saveWorkout(){sync();current.exercises=current.exercises.filter(e=>e.name.trim());if(!current.exercises.length)return alert("Add At Least One Movement.");const snap=JSON.parse(JSON.stringify(current));const focusKey=String(snap.focus||"").trim().toLowerCase();const match=db.history.findIndex(w=>w.date===snap.date&&String(w.focus||"").trim().toLowerCase()===focusKey);if(match>=0)db.history[match]=snap;else db.history.unshift(snap);db.draft=JSON.parse(JSON.stringify(current));localStorage.setItem(KEY,JSON.stringify(db));alert(match>=0?"Workout Updated.":"Workout Saved.")}
function lastFor(n){const focusKey=String(current.focus||"").trim().toLowerCase();let w=db.history.find(w=>!(w.date===current.date&&String(w.focus||"").trim().toLowerCase()===focusKey)&&w.exercises.some(e=>e.name.toLowerCase()===n.toLowerCase())),e=w?.exercises.find(e=>e.name.toLowerCase()===n.toLowerCase());return e?`${[...new Set(e.sets.map(s=>s.weight).filter(Boolean))].join("/")} @ ${e.sets.map(s=>s.reps).join(" - ")}${e.rest?` [${e.rest}]`:""}`:""}
function historyView(){if(!db.history.length)return`<div class="empty"><b>No Saved Workouts yet.</b><p>Your Workouts Will Appear Here.</p></div>`;return db.history.map((w,i)=>`<div class="history-wrap"><button class="history-delete" onclick="deleteWorkout(${i},event)">Delete Workout</button><div class="card history-item" data-history="${i}" onclick="openWorkout(${i})"><div class="history-head"><div class="history-head-text"><div class="history-title">${esc(fmt(w.date))} · ${esc(w.focus||"Workout")}</div><div class="meta">${esc(w.location||"")}${w.location&&w.note?" · ":""}${esc(w.note||"")}</div></div><button class="trash-btn" aria-label="Delete workout" onclick="deleteWorkout(${i},event)">🗑</button></div><div class="summary">${w.exercises.map(e=>`<div><b>${esc(e.name)}</b>: ${esc([...new Set(e.sets.map(s=>s.weight).filter(Boolean))].join("/"))} @ ${esc(e.sets.map(s=>s.reps).join(" - "))}${e.dropSet?.weight||e.dropSet?.reps?` · Drop: ${esc(e.dropSet.weight||"")} @ ${esc(e.dropSet.reps||"")}`:""}${e.rest?` [${esc(e.rest)}]`:""}</div>`).join("")}</div></div></div>`).join("")}
function deleteWorkout(i,ev){ev?.stopPropagation();if(!confirm("Delete This Workout?"))return;db.history.splice(i,1);localStorage.setItem(KEY,JSON.stringify(db));render()}
let historyTouchX=null;document.addEventListener("touchstart",e=>{let c=e.target.closest?.(".history-item");if(!c)return;historyTouchX=e.touches[0].clientX},{passive:true});document.addEventListener("touchend",e=>{let c=e.target.closest?.(".history-item");if(!c||historyTouchX===null)return;let dx=e.changedTouches[0].clientX-historyTouchX;historyTouchX=null;if(dx<-45){document.querySelectorAll(".history-item.swiped").forEach(x=>x!==c&&x.classList.remove("swiped"));c.classList.add("swiped");}else if(dx>35)c.classList.remove("swiped")},{passive:true});
function openWorkout(i){current=JSON.parse(JSON.stringify(db.history[i]));save();tab="log";render()}
function backupView(){return`<div class="card"><h2 style="margin:0 0 6px">Backup & Restore</h2><p class="mini">Export your workouts before changing phones or clearing app data.</p><div class="actions"><button onclick="exportData()">Export Backup</button><button class="secondary" onclick="document.getElementById('file').click()">Restore Backup</button></div><input id="file" type="file" accept=".json" style="display:none" onchange="importData(event)"></div><div class="card"><b>${db.history.length}</b> Saved Workout${db.history.length===1?"":"s"}</div>`}
async function exportData(){sync();const text=JSON.stringify({version:4,history:db.history},null,2),name="workout-log-backup.json",file=new File([text],name,{type:"application/json"});try{if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:"Workout Log Backup"});return}}catch(err){if(err?.name==="AbortError")return}const b=new Blob([text],{type:"application/json"}),a=document.createElement("a"),url=URL.createObjectURL(b);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.history))throw 0;if(!confirm("Replace Current Saved History With This Backup?"))return;db.history=x.history;db.draft=null;current=blank();localStorage.removeItem(ACTIVE_KEY);localStorage.setItem(KEY,JSON.stringify(db));tab="history";render();alert("Backup Restored.")}catch{alert("Invalid Workout Log Backup.")}};r.readAsText(f)}
function rememberRestTimer(v){const n=Number(v);if(Number.isFinite(n)&&n>=30&&n<=300)localStorage.setItem(TIMER_KEY,String(n))}
function getLastRestTimer(){return Math.max(30,Math.min(300,Number(localStorage.getItem(TIMER_KEY)||90)))}
function formatTimerSeconds(s){s=Math.max(0,Math.ceil(Number(s)||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function renderTimerState(){const rs=document.getElementById("restSelect"),btn=document.getElementById("timerActionBtn");if(!rs||!btn)return;if(timerActive||timerDone){let opt=rs.querySelector('option[value="__countdown"]');if(!opt){opt=document.createElement("option");opt.value="__countdown";rs.appendChild(opt)}opt.textContent=timerActive?formatTimerSeconds(Math.max(0,Math.ceil((timerEnd-Date.now())/1000))):"0:00";rs.value="__countdown";rs.style.pointerEvents=timerActive?"none":"";rs.toggleAttribute("aria-disabled",timerActive);opt.classList.toggle("timer-zero",timerDone);rs.classList.toggle("timer-zero",timerDone);btn.textContent="Start"}else{rs.style.pointerEvents="";rs.removeAttribute("aria-disabled");rs.querySelector('option[value="__countdown"]')?.remove();rs.classList.remove("timer-zero");rs.value=String(timerPreset||getLastRestTimer());btn.textContent="Start"}}
function timerAction(){if(timerActive)stopTimer();else startSelectedTimer()}
function startSelectedTimer(){let rs=document.getElementById("restSelect"),v=Number((timerDone?timerPreset:rs?.value)||getLastRestTimer());rememberRestTimer(v);startTimerSeconds(v)}
function startTimer(v){let p=v.split(":").map(Number),s=p.length===2?p[0]*60+p[1]:p[0]*60;startTimerSeconds(s)}
function startTimerSeconds(s){clearInterval(timerInt);s=Math.max(30,Math.min(300,Number(s)||90));timerPreset=s;timerDone=false;rememberRestTimer(s);timerEnd=Date.now()+s*1000;timerActive=true;renderTimerState();updateTimer();timerInt=setInterval(updateTimer,250)}
function updateTimer(){let l=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));const rs=document.getElementById("restSelect");if(rs&&timerActive){let opt=rs.querySelector('option[value="__countdown"]');if(!opt){opt=document.createElement("option");opt.value="__countdown";rs.appendChild(opt)}opt.textContent=formatTimerSeconds(l);rs.value="__countdown";rs.style.pointerEvents="none";rs.setAttribute("aria-disabled","true")}if(!l){clearInterval(timerInt);timerActive=false;timerDone=true;renderTimerState()}}
function stopTimer(){clearInterval(timerInt);timerActive=false;timerDone=false;renderTimerState()}
document.addEventListener("input",e=>{if(tab!=="log")return;const t=e.target;if(t.id==="focus"||t.id==="location"||t.id==="note"||t.id==="qname"||t.id==="qweight"||t.id==="qreps"||t.id==="qrest")sync()},{passive:true});
document.querySelectorAll(".bottom button").forEach(b=>b.onclick=()=>{const next=b.dataset.tab;if(tab==="log")sync();if(next==="log"&&tab!=="log"){const active=JSON.parse(localStorage.getItem(ACTIVE_KEY)||"null");if(active)current=active}tab=next;render()});render();
